name: planta_agua
description: "Aplicación móvil de control y seguimiento para planta de tratamiento de agua potable SENA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  provider: ^6.1.5+1
  go_router: ^18.1.3
  fl_chart: ^1.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  share_plus: ^13.3.1
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  camera: ^0.12.2
  google_mlkit_text_recognition: ^1.0.3
  image: ^4.3.0
  tflite_flutter: ^0.12.1
  flutter_gemma: ^0.13.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - imagenes/
    - assets/modelos/
